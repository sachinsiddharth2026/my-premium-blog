<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Article View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center">
            <a href="index.html" class="text-sm text-slate-400 hover:text-cyan-400 transition">← Back to Home</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12">
        <article id="article-content" class="prose prose-invert max-w-none">
            <h1 id="art-title" class="text-3xl sm:text-5xl font-black mb-4 text-slate-100">Loading Article...</h1>
            <p id="art-date" class="text-sm text-slate-500 mb-8"></p>
            
            <div id="free-content" class="text-slate-300 text-lg leading-relaxed space-y-6 mb-8"></div>

            <div id="premium-lock" class="hidden bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/30 rounded-2xl p-8 text-center my-12 shadow-xl shadow-amber-500/5">
                <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                </div>
                <h3 class="text-xl font-bold text-slate-100 mb-2">Unlock Premium Content</h3>
                <p class="text-slate-400 text-sm max-w-sm mx-auto mb-6">This premium guide contains critical insider strategies and deep monetization frameworks.</p>
                <button onclick="startPayment()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-amber-500/20 transform hover:-translate-y-0.5 text-sm">
                    Upgrade to Premium Plan (₹29)
                </button>
            </div>

            <div id="premium-content" class="hidden text-slate-300 text-lg leading-relaxed space-y-6 border-t border-slate-800 pt-8"></div>
        </article>
    </main>

    <script>
        let articleData = null;

        // Get filename from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');

        async function loadArticleDetail() {
            if(!file) return;
            try {
                const response = await fetch(`https://raw.githubusercontent.com/sachinsiddharth2026/my-premium-blog/main/_posts/${file}`);
                articleData = await response.json();

                document.getElementById('art-title').innerText = articleData.title;
                document.getElementById('art-date').innerText = "Published: " + (articleData.date || '2026');
                document.getElementById('free-content').innerHTML = parseMarkdown(articleData.freeContent || '');

                if(articleData.isPremium) {
                    document.getElementById('premium-lock').classList.remove('hidden');
                }
            } catch(err) {
                document.getElementById('art-title').innerText = "Article Not Found";
            }
        }

        // Clean Razorpay Integration
        function startPayment() {
            var options = {
                "key": "rzp_live_Ss9kzhdEN2jqCe", // यहाँ डैशबोर्ड से अपनी असली Test Key ID डालना!
                "amount": 2900, // ₹29.00 (पैसे में)
                "currency": "INR",
                "name": "NEXUS Premium",
                "description": articleData ? articleData.title : "Premium Article Access",
                "handler": function (response){
                    // Success callback
                    document.getElementById('premium-lock').classList.add('hidden');
                    const premiumDiv = document.getElementById('premium-content');
                    premiumDiv.classList.remove('hidden');
                    premiumDiv.innerHTML = parseMarkdown(articleData.premiumContent || '');
                },
                "theme": { "color": "#06b6d4" }
            };
            var rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
            });
            rzp1.open();
        }

        // Custom Markdown Parser to render Content and iframe perfectly without 404
        function parseMarkdown(text) {
            let html = text;
            // Handle iframes or custom HTML embedded in markdown
            html = html.replace(/<iframe[^>]*><\/iframe>/g, match => match);
            // Basic line breaks
            html = html.split('\n').map(para => para.trim() ? `<p>${para}</p>` : '').join('');
            return html;
        }

        window.addEventListener('DOMContentLoaded', loadArticleDetail);
    </script>
</body>
</html>
