<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Article View</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800/60 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center">
            <a href="index.html" class="text-sm text-slate-400 hover:text-white flex items-center gap-1">← Back to Home</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12">
        <div id="loading" class="text-center text-slate-400">Loading Article...</div>
        
        <div id="article-content" class="hidden">
            <h1 id="post-title" class="text-4xl font-extrabold mb-4 leading-tight"></h1>
            <p id="post-date" class="text-xs text-slate-400 mb-8"></p>
            
            <div id="free-content" class="prose prose-invert max-w-none text-slate-300 leading-relaxed space-y-6 mb-8"></div>
            
            <div id="paywall-box" class="hidden bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/30 rounded-2xl p-8 text-center my-12 shadow-xl">
                <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-400 font-bold">🔒</div>
                <h3 class="text-xl font-bold mb-2">Unlock Premium Content</h3>
                <p class="text-slate-400 text-sm mb-6 max-w-md mx-auto">This premium guide contains critical insider strategies and deep monetization frameworks.</p>
                <button onclick="startPayment()" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 font-semibold rounded-xl text-slate-950 shadow-lg shadow-amber-500/10 transition duration-200 text-sm cursor-pointer">Upgrade to Premium Plan (₹29)</button>
            </div>

            <div id="premium-content" class="hidden prose prose-invert max-w-none text-slate-300 leading-relaxed space-y-6 border-t border-slate-800/80 pt-8"></div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        async function loadArticle() {
            if(!fileName) return;
            try {
                const response = await fetch(`https://raw.githubusercontent.com/sachinsiddharth2026/my-premium-blog/main/_posts/${fileName}`);
                const post = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('article-content').classList.remove('hidden');
                
                document.getElementById('post-title').innerText = post.title;
                document.getElementById('post-date').innerText = `Published on ${post.date}`;
                document.getElementById('free-content').innerHTML = post.freeContent || '';

                if (post.isPremium) {
                    // Check if already paid
                    if (localStorage.getItem(`paid_${post.id}`)) {
                        showPremium(post.premiumContent);
                    } else {
                        document.getElementById('paywall-box').classList.remove('hidden');
                    }
                }
            } catch(err) {
                document.getElementById('loading').innerText = "Failed to load article.";
            }
        }

        function showPremium(content) {
            const premBox = document.getElementById('premium-content');
            premBox.innerHTML = content || '';
            premBox.classList.remove('hidden');
            document.getElementById('paywall-box').classList.add('hidden');
        }

        function startPayment() {
            var options = {
                "key": "https://rzp.io/rzp/L3kw4kWA", // अपनी असली रेज़रपे की 'Key ID' यहाँ डालें
                "amount": 29, 
                "currency": "INR",
                "name": "NEXUS Premium",
                "description": "Unlock Premium Article",
                "handler": function (response){
                    localStorage.setItem(`paid_${urlParams.get('id')}`, true);
                    alert("Payment Successful! Content Unlocked.");
                    location.reload();
                },
                "theme": { "color": "#f59e0b" }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
        }

        loadArticle();
    </script>
</body>
</html>
