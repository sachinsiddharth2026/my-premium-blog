<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Premium Knowledge Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800/60 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold tracking-wider bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">NEXUS</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <h1 class="text-4xl font-extrabold text-center mb-12 bg-gradient-to-r from-slate-100 to-slate-400 bg-clip-text text-transparent">Explore Premium Insights</h1>
        
        <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <script>
        // Netlify Identity Login Redirect
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) { window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; }); }
            });
        }

        // Fetch posts from Netlify/GitHub API
        async function loadBlogs() {
            const grid = document.getElementById('blog-grid');
            try {
                // Fetch list of files from _posts folder via public access
                const response = await fetch('https://api.github.com/repos/sachinsiddharth2026/my-premium-blog/contents/_posts');
                const files = await response.json();
                
                if(!files || files.length === 0) {
                    grid.innerHTML = `<p class="text-slate-400 text-center col-span-full">No articles published yet. Add one from Admin Panel!</p>`;
                    return;
                }

                for (let file of files) {
                    if (file.name.endsWith('.json') || file.name.endsWith('.md')) {
                        const postRes = await fetch(file.download_url);
                        const post = await postRes.json();
                        
                        const card = document.createElement('div');
                        card.className = "bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 hover:border-emerald-500/40 transition duration-300 flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-xs font-bold text-slate-400">${post.date}</span>
                                    ${post.isPremium ? '<span class="px-2.5 py-1 text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full">Premium</span>' : '<span class="px-2.5 py-1 text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">Free</span>'}
                                </div>
                                <h3 class="text-xl font-bold mb-2 text-slate-100">${post.title}</h3>
                                <p class="text-slate-400 text-sm line-clamp-3 mb-6">${post.description}</p>
                            </div>
                            <a href="blog-detail.html?id=${post.id}&file=${file.name}" class="w-full text-center py-2.5 bg-slate-800 hover:bg-emerald-600 font-medium rounded-xl transition duration-200 block text-sm">Read Article</a>
                        `;
                        grid.appendChild(card);
                    }
                }
            } catch (err) {
                grid.innerHTML = `<p class="text-slate-400 text-center col-span-full">Write your first post from the admin panel to display here.</p>`;
            }
        }
        loadBlogs();
    </script>
</body>
</html>
