<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Premium Knowledge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black tracking-wider text-cyan-400">NEXUS</span>
            </div>
            <div class="flex items-center gap-4">
                <div data-netlify-identity-menu></div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="text-center mb-16">
            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-cyan-400 via-teal-200 to-indigo-400 bg-clip-text text-transparent">
                Explore Premium Insights
            </h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">
                Mastering the Web3 and AI Creator Revolution with actionable strategies.
            </p>
        </div>

        <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <script>
        // Netlify Identity Redirect Setup
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        // Fetching blog articles from GitHub repository path
        async function loadArticles() {
            const grid = document.getElementById('articles-grid');
            try {
                // Fetching the published articles from your _posts folder
                const response = await fetch('https://api.github.com/repos/sachinsiddharth2026/my-premium-blog/contents/_posts');
                const files = await response.json();
                
                if(!files || files.length === 0) {
                    grid.innerHTML = `<p class="text-slate-500 col-span-full text-center">No articles found. Publish one from CMS!</p>`;
                    return;
                }

                for (let file of files) {
                    if (file.name.endsWith('.json')) {
                        const res = await fetch(file.download_url);
                        const article = await res.json();
                        
                        const card = document.createElement('div');
                        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-6 hover:border-slate-700 transition duration-300 flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-xs text-slate-500">${article.date || 'Recent'}</span>
                                    ${article.isPremium ? '<span class="px-2 py-1 text-xs bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/20 font-medium">Premium</span>' : '<span class="px-2 py-1 text-xs bg-green-500/10 text-green-400 rounded-full border border-green-500/20 font-medium">Free</span>'}
                                </div>
                                <h3 class="text-xl font-bold text-slate-100 mb-2 line-clamp-2">${article.title}</h3>
                                <p class="text-slate-400 text-sm mb-6 line-clamp-3">${article.description}</p>
                            </div>
                            <button onclick="viewArticle('${file.name}')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl font-medium transition text-sm">
                                Read Article
                            </button>
                        `;
                        grid.appendChild(card);
                    }
                }
            } catch (err) {
                grid.innerHTML = `<p class="text-rose-400 col-span-full text-center">Failed to load articles. Please check repository path.</p>`;
            }
        }

        function viewArticle(fileName) {
            // Redirecting to detail view with exact filename
            window.location.href = `blog-detail.html?file=${fileName}`;
        }

        window.addEventListener('DOMContentLoaded', loadArticles);
    </script>
</body>
</html>
