<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS.blog — Tech, Finance & Research</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen font-sans">

    <nav class="border-b border-slate-900 bg-[#0b0f19]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black tracking-wider text-cyan-400">NEXUS<span class="text-xs text-slate-400 font-normal">.blog</span></span>
            </div>
            
            <div class="hidden md:flex items-center relative w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-500 text-sm"></i>
                <input type="text" id="search-input" onkeyup="filterArticles()" placeholder="Search finance, tech, research..." class="w-full bg-[#111827] border border-slate-800 rounded-xl pl-9 pr-4 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition">
            </div>

            <div class="flex items-center gap-4">
                <span class="text-sm text-amber-400 font-medium hidden sm:flex items-center gap-1"><i class="fa-solid fa-crown text-xs"></i> Premium</span>
                <div data-netlify-identity-menu class="text-sm font-medium"></div>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-12 text-center relative">
        <div class="inline-flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase mb-6 mx-auto">
            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Knowledge Hub
        </div>
        <h1 class="text-4xl sm:text-6xl font-black tracking-tight mb-4 text-slate-100">
            Insightful articles on <span class="bg-gradient-to-r from-cyan-400 via-teal-300 to-indigo-400 bg-clip-text text-transparent">Tech, Finance & Research.</span>
        </h1>
        <p class="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto">
            Welcome to a minimalist space curated for deep thinkers, developers, and students. Filter by your interest and start reading.
        </p>
    </header>

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-12">
        <div class="flex flex-wrap justify-center items-center gap-3" id="filter-tabs">
            <button onclick="setActiveFilter('all')" id="tab-all" class="px-5 py-2 rounded-xl text-sm font-semibold transition bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/10">All</button>
            <button onclick="setActiveFilter('Finance')" id="tab-Finance" class="px-5 py-2 rounded-xl text-sm font-semibold transition bg-[#111827] text-slate-400 border border-slate-800 hover:border-slate-700 hover:text-slate-200">Finance</button>
            <button onclick="setActiveFilter('Technical')" id="tab-Technical" class="px-5 py-2 rounded-xl text-sm font-semibold transition bg-[#111827] text-slate-400 border border-slate-800 hover:border-slate-700 hover:text-slate-200">Technical</button>
            <button onclick="setActiveFilter('Study Materials')" id="tab-Study-Materials" class="px-5 py-2 rounded-xl text-sm font-semibold transition bg-[#111827] text-slate-400 border border-slate-800 hover:border-slate-700 hover:text-slate-200">Study Materials</button>
            <button onclick="setActiveFilter('Deep Research')" id="tab-Deep-Research" class="px-5 py-2 rounded-xl text-sm font-semibold transition bg-[#111827] text-slate-400 border border-slate-800 hover:border-slate-700 hover:text-slate-200 flex items-center gap-1.5">Deep Research <i class="fa-solid fa-lock text-xs text-amber-400/80"></i></button>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24">
        <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="text-center col-span-full text-slate-500 py-12">
                <i class="fa-solid fa-circle-notch animate-spin text-2xl text-cyan-500 mb-2"></i>
                <p class="text-sm">Fetching premium entries from cloud infrastructure...</p>
            </div>
        </div>
    </main>

    <script>
        let allArticles = [];
        let currentFilter = 'all';

        // Initialize Netlify Identity Control
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
                }
            });
        }

        // Fetch Published Posts from GitHub Repository Cloud Node
        async function fetchWorkspaceArticles() {
            const grid = document.getElementById('articles-grid');
            try {
                const response = await fetch('https://api.github.com/repos/sachinsiddharth2026/my-premium-blog/contents/_posts');
                const files = await response.json();
                
                if (!files || files.length === 0 || files.message === "Not Found") {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-2xl">No articles published yet. Access the Netlify CMS admin dashboard panel to write your first piece!</div>`;
                    return;
                }

                allArticles = [];
                for (let file of files) {
                    if (file.name.endsWith('.json')) {
                        const fileRes = await fetch(file.download_url);
                        const data = await fileRes.json();
                        // Save structural properties with file identifier reference key
                        allArticles.push({ filename: file.name, ...data });
                    }
                }
                renderArticlesDisplay();
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400">Error connecting to storage database. Verify your repository branch setup.</div>`;
            }
        }

        // Master UI Processing Block Loop
        function renderArticlesDisplay() {
            const grid = document.getElementById('articles-grid');
            grid.innerHTML = '';

            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            // Filter system according to category selection rules and query arrays
            const filtered = allArticles.filter(art => {
                const matchesCategory = (currentFilter === 'all') || (art.id === currentFilter);
                const matchesSearch = art.title.toLowerCase().includes(searchQuery) || art.description.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No matching documentation matches current search criteria.</div>`;
                return;
            }

            filtered.forEach(art => {
                const card = document.createElement('div');
                card.className = "bg-[#0b0f19] border border-slate-900 rounded-2xl overflow-hidden hover:border-slate-800 transition duration-300 flex flex-col justify-between group shadow-xl";
                
                // Set default display fallback illustrations based on category configuration keys
                let imageBanner = 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=600&auto=format&fit=crop'; // Default Tech
                if (art.id === 'Finance') imageBanner = 'https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?q=80&w=600&auto=format&fit=crop';
                if (art.id === 'Study Materials') imageBanner = 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?q=80&w=600&auto=format&fit=crop';
                if (art.id === 'Deep Research') imageBanner = 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop';

                card.innerHTML = `
                    <div>
                        <div class="h-48 w-full overflow-hidden relative border-b border-slate-950">
                            <img src="${imageBanner}" alt="Banner" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 filter brightness-90">
                            <div class="absolute top-4 right-4">
                                ${art.isPremium ? 
                                    '<span class="px-2.5 py-1 text-xs bg-amber-500 text-slate-950 font-bold rounded-lg flex items-center gap-1 shadow-md"><i class="fa-solid fa-crown text-[10px]"></i> PREMIUM</span>' : 
                                    '<span class="px-2.5 py-1 text-xs bg-slate-900/90 text-emerald-400 font-semibold rounded-lg border border-emerald-500/20 backdrop-blur">FREE</span>'
                                }
                            </div>
                            <div class="absolute bottom-3 left-4">
                                <span class="px-2 py-0.5 text-[11px] bg-slate-950/80 text-cyan-400 font-bold rounded border border-cyan-500/20 backdrop-blur uppercase tracking-wide">${art.id || 'General'}</span>
                            </div>
                        </div>
                        <div class="p-6">
                            <p class="text-xs text-slate-500 mb-2 font-medium">${art.date || 'Recent Upload'}</p>
                            <h3 class="text-lg font-bold text-slate-100 group-hover:text-cyan-400 transition mb-2 line-clamp-2 leading-snug">${art.title}</h3>
                            <p class="text-slate-400 text-xs line-clamp-3 leading-relaxed">${art.description}</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <button onclick="viewTargetArticle('${art.filename}')" class="w-full bg-[#111827] hover:bg-[#1f2937] text-slate-200 border border-slate-800 hover:border-slate-700 py-2.5 rounded-xl text-xs font-semibold transition tracking-wide">
                            Read Full Insights
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter tab triggers
        function setActiveFilter(filterId) {
            currentFilter = filterId;
            const buttons = document.querySelectorAll('#filter-tabs button');
            
            // Clean active classes
            buttons.forEach(btn => {
                btn.className = "px-5 py-2 rounded-xl text-sm font-semibold transition bg-[#111827] text-slate-400 border border-slate-800 hover:border-slate-700 hover:text-slate-200";
                if(btn.id === 'tab-Deep-Research') btn.classList.add('flex', 'items-center', 'gap-1.5');
            });

            // Set state UI on click
            const activeNormalizedId = filterId.replace(' ', '-');
            const targetBtn = document.getElementById(`tab-${activeNormalizedId}`);
            if (targetBtn) {
                targetBtn.className = "px-5 py-2 rounded-xl text-sm font-semibold transition bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/10";
                if(filterId === 'Deep Research') targetBtn.classList.add('flex', 'items-center', 'gap-1.5');
            }
            renderArticlesDisplay();
        }

        function filterArticles() {
            renderArticlesDisplay();
        }

        function viewTargetArticle(fileName) {
            window.location.href = `blog-detail.html?file=${fileName}`;
        }

        window.addEventListener('DOMContentLoaded', fetchWorkspaceArticles);
    </script>
</body>
</html>
